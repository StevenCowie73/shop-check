<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Shop Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---- Design tokens (from the Claude Design build spec) ---- */
  :root {
    /* color */
    --ground: #F4EFE6;
    --surface: #FBF8F2;
    --callout: #F3E7D3;
    --ink: #1C1917;
    --body-muted: #3D3833;
    --muted: #5C5650;
    --line: #CFC6B6;
    --track: #D9D1C3;
    --accent: #C4501B;
    --accent-hover: #A94314;
    --accent-dark: #8F3810;
    --on-accent: #FFF7EE;
    --hover-fill: #EFE7D9;
    --pressed-fill: #E6DCC9;
    --dashed: #8A827A;
    --placeholder: #8A827A;
    --disabled-opacity: 0.45;

    /* type */
    --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --fs-display: 44px;   --fw-display: 700;   /* app name, desktop headline */
    --fs-result: 34px;    --fw-result: 700;    /* result name */
    --fs-question: 30px;  --fw-question: 700;
    --fs-tagline: 22px;   --fw-tagline: 500;
    --fs-title: 20px;     --fw-title: 700;     /* card title, buttons */
    --fs-answer: 19px;    --fw-answer: 600;
    --fs-body: 17px;      --fw-body: 400;      /* card body */
    --fs-quiet-body: 15px;                     /* body inside quiet cards (artboard) */
    --fs-label: 16px;     --fw-label: 600;     /* labels, links, callout */
    --fs-kicker-lg: 18px;                      /* "Start here:" (artboard) */
    --fs-fine: 14px;      --fw-fine: 400;
    --fs-bottom-link: 15px;
    --fs-kicker: 13px;    --fw-kicker: 700;
    --tight: -0.02em;

    /* spacing */
    --pad-x: 24px;
    --pad-y: 28px;
    --gap-question: 28px;
    --gap-block: 24px;
    --pad-card: 20px;
    --pad-quiet: 16px;
    --gap-stack: 12px;
    --gap-label: 8px;
    --max-desktop: 1040px;

    /* shape */
    --radius: 8px;
    --radius-callout: 6px;
    --radius-bar: 2px;
    --border-strong: 2px;
    --border-quiet: 1px;

    /* controls */
    --h-primary: 60px;
    --h-secondary: 56px;
    --h-input: 60px;
    --ring: 26px;
    --bar-h: 4px;
    --rule-w: 40px;
    --rule-h: 6px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    font-size: var(--fs-body);
    line-height: 1.5;
    background: var(--ground);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  h1, h2, h3, p, pre { margin: 0; }
  button, input, a { font-family: inherit; }
  :focus { outline: none; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--callout); }

  /* ---- Screen frame ---- */
  .wrap {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: var(--pad-y) var(--pad-x);
    max-width: 480px;
    margin: 0 auto;
  }
  .screen { display: flex; flex-direction: column; gap: var(--gap-block); flex: 1; }
  .centered { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--gap-question); }
  .fine {
    font-size: var(--fs-fine); font-weight: var(--fw-fine);
    color: var(--muted); text-align: center; line-height: 1.45; text-wrap: pretty;
  }
  .fine.bottom { margin-top: auto; padding-top: var(--gap-block); }
  .rule { width: var(--rule-w); height: var(--rule-h); background: var(--accent); border-radius: var(--radius-bar); }

  /* ---- Type ---- */
  .display { font-size: var(--fs-display); font-weight: var(--fw-display); line-height: 1.05; letter-spacing: var(--tight); }
  .tagline { font-size: var(--fs-tagline); font-weight: var(--fw-tagline); line-height: 1.35; text-wrap: pretty; }
  .question { font-size: var(--fs-question); font-weight: var(--fw-question); line-height: 1.15; letter-spacing: -0.015em; text-wrap: pretty; }
  .result-name { font-size: var(--fs-result); font-weight: var(--fw-result); line-height: 1.1; letter-spacing: var(--tight); text-wrap: pretty; }
  .kicker-lg { font-size: var(--fs-kicker-lg); font-weight: var(--fw-label); color: var(--muted); }
  .kicker {
    font-size: var(--fs-kicker); font-weight: var(--fw-kicker);
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
  }
  .label { font-size: var(--fs-label); font-weight: var(--fw-label); display: block; margin-bottom: var(--gap-label); }
  .stack { display: flex; flex-direction: column; gap: var(--gap-label); }

  /* ---- Controls ---- */
  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: var(--h-primary); padding: 0 16px;
    border: 0; border-radius: var(--radius);
    background: var(--accent); color: var(--on-accent);
    font-size: var(--fs-title); font-weight: var(--fw-title);
    text-decoration: none; cursor: pointer; text-align: center; line-height: 1.2;
    touch-action: manipulation;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { background: var(--accent-dark); }
  .btn:disabled { opacity: var(--disabled-opacity); cursor: not-allowed; background: var(--accent); }
  .btn.secondary {
    height: var(--h-secondary);
    background: transparent; color: var(--ink);
    border: var(--border-strong) solid var(--ink);
  }
  .btn.secondary:hover { background: var(--hover-fill); }
  .btn.secondary:active { background: var(--pressed-fill); }

  input[type="text"] {
    width: 100%; height: var(--h-input); padding: 0 16px;
    border: var(--border-strong) solid var(--ink); border-radius: var(--radius);
    background: var(--surface); color: var(--ink); font-size: 20px;
  }
  input[type="text"]::placeholder { color: var(--placeholder); }

  .choices { display: flex; flex-direction: column; gap: var(--gap-stack); }
  .choice {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; min-height: var(--h-primary); padding: 14px 18px;
    border: var(--border-strong) solid var(--line); border-radius: var(--radius);
    background: var(--surface); color: var(--ink);
    font-size: var(--fs-answer); font-weight: var(--fw-answer); text-align: left; line-height: 1.25;
    cursor: pointer; touch-action: manipulation;
  }
  .choice:hover { background: var(--hover-fill); }
  .choice:active { background: var(--pressed-fill); }
  .choice .ring {
    width: var(--ring); height: var(--ring); flex: none; border-radius: 50%;
    border: var(--border-strong) solid var(--line); background: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .choice .ring svg { width: 14px; height: 14px; display: none; }
  .choice.selected { border-color: var(--ink); }
  .choice.selected .ring { border-color: var(--accent); background: var(--accent); }
  .choice.selected .ring svg { display: block; }

  a.link, button.link {
    display: inline-block; background: none; border: 0; cursor: pointer;
    color: var(--ink); font-size: var(--fs-label); font-weight: var(--fw-label);
    text-decoration: underline; text-underline-offset: 3px; padding: 8px 0;
  }
  a.link:hover, button.link:hover { color: var(--accent); }
  .link.quiet { color: var(--muted); font-size: var(--fs-bottom-link); }
  .bottom-links { display: flex; justify-content: center; gap: 28px; padding-top: 8px; }
  .for-line {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    font-size: var(--fs-fine); color: var(--muted); margin-bottom: -12px;
  }
  .for-line .link.inline { font-size: var(--fs-fine); padding: 8px 0; }
  .bottom-links.start .link { visibility: hidden; }

  /* ---- Progress ---- */
  .progress { display: flex; flex-direction: column; gap: 10px; }
  .progress-row { display: flex; justify-content: space-between; align-items: baseline; }
  .progress-row .count { font-size: var(--fs-label); font-weight: var(--fw-label); color: var(--muted); }
  .bar { height: var(--bar-h); background: var(--track); border-radius: var(--radius-bar); overflow: hidden; }
  .bar > div { height: 100%; background: var(--ink); border-radius: var(--radius-bar); transition: width 200ms ease; }

  /* ---- Results ---- */
  .hero { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--surface); border-radius: var(--radius);
    display: flex; flex-direction: column;
  }
  .card.main { border: var(--border-strong) solid var(--ink); padding: var(--pad-card); gap: 16px; }
  .card.main .body { font-size: var(--fs-body); font-weight: var(--fw-body); line-height: 1.5; text-wrap: pretty; }
  .callout {
    background: var(--callout); border-radius: var(--radius-callout);
    padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
  }
  .callout .kicker { color: var(--accent-dark); }
  .callout .cost { font-size: var(--fs-label); font-weight: var(--fw-label); line-height: 1.4; }
  .quiet-list { display: flex; flex-direction: column; gap: var(--gap-stack); }
  .card.quiet { border: var(--border-quiet) solid var(--line); padding: var(--pad-quiet) 18px; gap: 8px; }
  .card.quiet h2 { font-size: var(--fs-title); font-weight: var(--fw-title); line-height: 1.2; }
  .card.quiet .body { font-size: var(--fs-quiet-body); line-height: 1.45; color: var(--body-muted); text-wrap: pretty; }
  .card.quiet .cost { font-size: var(--fs-fine); color: var(--muted); line-height: 1.45; }
  .card.quiet .cost strong { font-weight: 700; }
  .not {
    border: var(--border-strong) dashed var(--dashed); border-radius: var(--radius);
    padding: 16px 18px; font-size: var(--fs-label); font-weight: 500; line-height: 1.5; text-wrap: pretty;
  }
  .contact { display: flex; flex-direction: column; gap: var(--gap-stack); align-items: center; }
  .contact .btn { align-self: stretch; }
  .contact-head { display: none; font-size: var(--fs-tagline); font-weight: 700; line-height: 1.2; align-self: flex-start; }
  .msgbox {
    align-self: stretch;
    background: var(--surface); border: var(--border-strong) solid var(--ink); border-radius: var(--radius);
    padding: var(--pad-card); display: flex; flex-direction: column; gap: 14px;
  }
  .msg { font-family: inherit; font-size: var(--fs-label); line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: var(--ink); }
  .phone { align-self: stretch; display: flex; flex-direction: column; gap: 6px; text-align: center; }
  .phone-label { font-size: var(--fs-label); font-weight: var(--fw-label); color: var(--muted); }
  .phone-number { font-size: var(--fs-display); font-weight: var(--fw-display); letter-spacing: var(--tight); color: var(--accent); line-height: 1.1; user-select: all; }
  .left { display: flex; flex-direction: column; gap: var(--gap-block); }
  .screen:has(.good) { justify-content: center; }
  .good { display: flex; flex-direction: column; gap: var(--gap-block); }
  .good .body { font-size: var(--fs-body); line-height: 1.5; text-wrap: pretty; }
  .good .contact { padding-top: 8px; }

  /* ---- Desktop results: two columns ---- */
  @media (min-width: 900px) {
    .wrap.wide { max-width: var(--max-desktop); padding: 56px 40px 64px; }
    .wrap.wide .screen { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 48px; align-items: start; }
    .wrap.wide .left { display: flex; flex-direction: column; gap: var(--gap-block); }
    .wrap.wide .right { display: flex; flex-direction: column; gap: 20px; position: sticky; top: 24px; }
    .wrap.wide .result-name { font-size: var(--fs-display); line-height: 1.05; }
    .wrap.wide .card.main { padding: 24px; }
    .wrap.wide .card.main .body { font-size: 18px; }
    .wrap.wide .quiet-list { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-stack); }
    .wrap.wide .quiet-list.single { grid-template-columns: 1fr; }
    .wrap.wide .bottom-links { grid-column: 1; justify-content: flex-start; padding-top: 0; }
    .wrap.wide .contact { align-items: flex-start; }
    .wrap.wide .contact-head { display: block; }
    .wrap.wide .contact .fine { text-align: left; }
    .wrap.wide .phone { text-align: left; }
    .wrap.wide .good { justify-content: flex-start; }
    .wrap.wide .good .result-name { font-size: var(--fs-display); }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <main id="app" aria-live="polite" class="screen"></main>
</div>

<script>
/* =====================================================================
   YOUR CONTACT DETAILS. The results screen's "Text me" button uses
   these. Digits, spaces and dashes are fine for the phone number.
   ===================================================================== */
const CONTACT = {
  phone: "000-000-0000",
  email: "you@example.com"
};

/* =====================================================================
   EDIT THE WORDING HERE.
   Everything the results screen says lives in this one object.

   - "name"  : the module's title as it appears on screen.
   - "what"  : 2-3 plain sentences on what it does. You can use {name}
               (the business name) and {jobs} (the jobs-per-month answer).
   - "cost"  : what it likely costs them today to not have it, one line
               per jobs-per-month answer so it stays concrete. Used for
               strong matches ("Never", "No", voicemail).
   - "weakCost": softer version of the same, used for weak matches
               ("Sometimes", "Yes, but it's old"). Falls back to "cost"
               if missing.
   The order of the keys below IS the priority order for "Start here".
   ===================================================================== */
const MODULES = {
  missedCallTextBack: {
    name: "Missed-Call Text-Back",
    what: "When a call goes to voicemail, the caller gets a text back within seconds: \"Hey, it's {name}, I'm on a job right now. What can I help with?\" They reply, and you see it the next time you look at your phone. No app to learn, no extra phone to carry.",
    cost: {
      "1-5":  "At 1-5 jobs a month, one missed call can be a quarter of your month. Most people who hit voicemail don't leave a message. They just call the next name on the list.",
      "5-15": "At 5-15 jobs a month you're probably missing a few calls a week. If just one of those a month would have booked, that's a whole job walking to a competitor.",
      "15+":  "At 15+ jobs a month the phone rings more than anyone could answer. Missing a handful of calls a week likely means two or three lost jobs a month, every month."
    },
    weakCost: {
      "1-5":  "At 1-5 jobs a month you're catching most calls, but the ones you miss on a job site are the ones that matter. A quick text back keeps them warm until you can ring them.",
      "5-15": "At 5-15 jobs a month you're on the tools too much to catch everything. A text back means the calls that slip through don't go cold.",
      "15+":  "At 15+ jobs a month nobody catches every call. This covers the ones that get away while you're up a ladder."
    }
  },
  quoteFollowUp: {
    name: "Quote Follow-Up",
    what: "Every quote you send gets a friendly nudge if it goes quiet. A short text after a few days, one more after a week. You set the words once. When the customer answers, it lands with you like any other text.",
    cost: {
      "1-5":  "With 1-5 jobs a month, every quote counts. Quotes rarely die because of price. They die because the customer got busy. Bringing back one quiet quote a month is a big chunk of your income.",
      "5-15": "At 5-15 jobs a month you're likely sending twice that many quotes. If a third of them go quiet and a nudge rescues one or two, that's an extra job or two a month for no extra effort.",
      "15+":  "At 15+ jobs a month you don't have time to chase quotes, so most quiet ones just die. Bringing back even one in ten is a couple of extra jobs a month."
    },
    weakCost: {
      "1-5":  "At 1-5 jobs a month you're following up when you remember. The ones you forget were probably the closest to saying yes. This just makes sure none get forgotten.",
      "5-15": "At 5-15 jobs a month, 'sometimes' usually means the busy weeks get skipped, and busy weeks are when the most quotes are out. This does the chasing so you don't have to.",
      "15+":  "At 15+ jobs a month you can't chase every quote by hand, so some slip. Making it automatic turns 'sometimes' into 'every time' with no extra work."
    }
  },
  reviewRequests: {
    name: "Review Requests",
    what: "When a job wraps up, the customer gets a text with a link straight to your Google reviews. People leave a review when it takes ten seconds and you ask at the right moment. This asks every customer, every time, so you don't have to remember.",
    cost: {
      "1-5":  "At 1-5 jobs a month, a handful of good reviews is the difference between showing up on Google and not. Right now every finished job is a review you're not getting.",
      "5-15": "At 5-15 jobs a month you could be adding several reviews a month. Instead the only people writing reviews are the unhappy ones, and that's what new customers see first.",
      "15+":  "At 15+ jobs a month you're leaving dozens of reviews on the table every year. The outfit with 80 reviews gets the call before the one with 8, even if you do better work."
    },
    weakCost: {
      "1-5":  "At 1-5 jobs a month you're asking when it comes to mind. Asking every time, right as the job wraps up, could roughly double what you're getting now.",
      "5-15": "At 5-15 jobs a month, asking sometimes still leaves most good jobs unreviewed. Asking automatically could add a few reviews a month with no extra effort.",
      "15+":  "At 15+ jobs a month you're doing a lot of good work that never turns into a review. Making the ask automatic could mean dozens more a year."
    }
  },
  onePageSite: {
    name: "One-Page Site",
    what: "One clean page: what you do, where you work, your phone number, a few photos of your work, and your reviews. It loads fast on a phone and the number is one tap to call. No blog, no fluff.",
    cost: {
      "1-5":  "At 1-5 jobs a month, most customers Google you before they call, even the referrals. With nothing to find, some of them figure you've closed up and move on.",
      "5-15": "At 5-15 jobs a month your name is coming up in Google regularly. When there's nothing to tap on, you're handing those searches to whoever does have a page.",
      "15+":  "At 15+ jobs a month you've got the reputation but nowhere online to prove it. You're winning on word of mouth alone and losing everyone who can't find you."
    },
    weakCost: {
      "1-5":  "At 1-5 jobs a month an old site beats none, but customers notice dated photos and a page that hasn't changed in years. A quick refresh keeps their trust.",
      "5-15": "At 5-15 jobs a month people are checking your site before they call. An old one raises a small doubt at exactly the wrong moment. A clean page fixes that.",
      "15+":  "At 15+ jobs a month your reputation is ahead of your website. An old site undersells the work you're doing now. A fresh page catches up."
    }
  }
};

/* Shown when none of the rules fire. */
const ALL_GOOD = {
  name: "You're in good shape",
  what: "You pick up the phone, you chase quiet quotes, you ask for reviews, and people can find you online. That's most of the battle. Nothing here is falling through the cracks that we can see."
};

/* The line that goes at the bottom of every results screen. */
const NOT_LINE = "This doesn't replace you or anyone who works for you. It handles the stuff that falls through the cracks when you're busy.";

/* The "get in touch" block under the results. */
const CONTACT_COPY = {
  button: "Want this set up? Text me the details",
  emailLink: "Or email me instead",
  reassure: "No cost to look. I'll call you, we'll talk it through, and you decide.",
  copy: "Copy details",
  copied: "Copied",
  callLabel: "Text or call:",
  subject: "Shop Check results",
  signoff: "Sent from Shop Check"
};

/* ---------------------------------------------------------------------
   Questions. "key" is what ends up in config.json.
   --------------------------------------------------------------------- */
const QUESTIONS = [
  { key: "businessName", type: "text", title: "What's the name of your business?", lead: "Eight quick questions. Takes about a minute. Nothing leaves your phone.", placeholder: "e.g. Cowie Plumbing" },
  { key: "trade", title: "What do you do?", options: ["Renovation", "Plumbing", "Electrical", "HVAC", "Landscaping", "Other"] },
  { key: "phone", title: "Who answers the phone when you're on a job?", options: ["Me, when I can", "Someone in the office", "Nobody, it goes to voicemail", "I don't know"] },
  { key: "quotes", title: "How do you send quotes?", options: ["Text", "Email", "Paper", "Verbally"] },
  { key: "followUp", title: "Do you follow up on quotes that go quiet?", options: ["Always", "Sometimes", "Never"] },
  { key: "reviews", title: "Do you ask customers for Google reviews?", options: ["Every job", "Sometimes", "Never"] },
  { key: "website", title: "Do you have a website?", options: ["Yes, and I update it", "Yes, but it's old", "No"] },
  { key: "jobsPerMonth", title: "Roughly how many jobs a month?", options: ["1-5", "5-15", "15+"] }
];

/* ---------------------------------------------------------------------
   The rules. Each module has a "strong" and a "weak" test.

   - strong : this answer alone is enough to make the module "Start here".
   - weak   : worth doing, but only shows as "Next" / "After that".
              If NOTHING strong fires, the top weak match becomes
              "Start here" anyway (better than telling them all is well).
   Priority order for "Start here" = the order of keys in MODULES above.
   --------------------------------------------------------------------- */
const RULES = {
  missedCallTextBack: {
    strong: a => a.phone === "Nobody, it goes to voicemail" || a.phone === "I don't know",
    weak:   a => a.phone === "Me, when I can"
  },
  quoteFollowUp: {
    strong: a => a.followUp === "Never",
    weak:   a => a.followUp === "Sometimes"
  },
  reviewRequests: {
    strong: a => a.reviews === "Never",
    weak:   a => a.reviews === "Sometimes"
  },
  onePageSite: {
    strong: a => a.website === "No",
    weak:   a => a.website === "Yes, but it's old"
  }
};

const MAX_NEXT = 2;

/* ===================== No need to edit below here ===================== */

const app = document.getElementById("app");
const wrap = document.getElementById("wrap");
const answers = {};
let index = 0;

/* A link that carries a name starts at the first question, not the
   name field. Back and "Not you? Change it" still reach the field. */
function seedFromParams() {
  if (PARAMS.name) { answers.businessName = PARAMS.name; return 1; }
  return 0;
}

function evaluate(a) {
  const enabled = {};
  const strength = {};
  for (const key of Object.keys(MODULES)) {
    const r = RULES[key];
    strength[key] = r.strong(a) ? "strong" : (r.weak(a) ? "weak" : null);
    enabled[key] = strength[key] !== null;
  }
  const matched = Object.keys(MODULES).filter(k => enabled[k]);   // priority order
  const strong = matched.filter(k => strength[k] === "strong");
  const startHere = strong[0] || matched[0] || null;               // weak only wins if nothing strong fired
  const next = matched.filter(k => k !== startHere).slice(0, MAX_NEXT);
  return { enabled, strength, startHere, next };
}

function fill(text, a) {
  return text.replace(/\{name\}/g, a.businessName || "us").replace(/\{jobs\}/g, a.jobsPerMonth || "");
}

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  (children || []).forEach(c => node.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return node;
}

function check() {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 16 16");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", "M3 8.5l3.2 3.2L13 5");
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "#FFF7EE");
  path.setAttribute("stroke-width", "2.4");
  path.setAttribute("stroke-linecap", "round");
  path.setAttribute("stroke-linejoin", "round");
  svg.appendChild(path);
  return svg;
}

function link(text, onClick, quiet) {
  const b = el("button", { class: "link" + (quiet ? " quiet" : ""), text, type: "button" });
  b.addEventListener("click", onClick);
  return b;
}

function goBack() { index = Math.max(0, index - 1); render(); }
function startOver() {
  for (const k in answers) delete answers[k];
  if (PARAMS.name) answers.businessName = PARAMS.name;  /* keep the link's name, editable */
  index = 0;
  render();
}

function render() {
  app.innerHTML = "";
  wrap.classList.remove("wide");
  if (index >= QUESTIONS.length) return renderResults();
  const q = QUESTIONS[index];
  if (q.type === "text") return renderStart(q);

  /* Question screen */
  const total = QUESTIONS.length;
  const progress = el("div", { class: "progress" }, [
    el("div", { class: "progress-row" }, [
      link("Back", goBack),
      el("div", { class: "count", "aria-live": "polite", text: `${index + 1} of ${total}` })
    ]),
    el("div", { class: "bar", "aria-hidden": "true" }, [ el("div", { style: `width:${((index + 1) / total) * 100}%` }) ])
  ]);
  app.appendChild(progress);

  const block = el("div", { class: "centered", style: "flex:0;justify-content:flex-start" });
  if (index === 1 && PARAMS.name && answers.businessName) {
    const change = link("Not you? Change it", () => { index = 0; render(); }, true);
    change.classList.add("inline");
    block.appendChild(el("div", { class: "for-line" }, [
      el("span", { text: `For: ${answers.businessName}` }),
      change
    ]));
  }
  block.appendChild(el("h1", { class: "question", text: q.title }));
  const list = el("div", { class: "choices", role: "group", "aria-label": q.title });
  q.options.forEach(opt => {
    const selected = answers[q.key] === opt;
    const b = el("button", { class: "choice" + (selected ? " selected" : ""), type: "button", "aria-pressed": selected ? "true" : "false" }, [
      el("span", { text: opt }),
      el("span", { class: "ring" }, [check()])
    ]);
    b.addEventListener("click", () => { answers[q.key] = opt; index++; render(); });
    list.appendChild(b);
  });
  block.appendChild(list);
  app.appendChild(block);
  app.appendChild(el("p", { class: "fine bottom", text: "Tap an answer to keep going." }));
  window.scrollTo(0, 0);
}

function renderStart(q) {
  const input = el("input", {
    type: "text", id: "biz", placeholder: q.placeholder || "", autocomplete: "organization",
    maxlength: "80", value: answers[q.key] || ""
  });
  const go = el("button", { class: "btn", text: "Let's go", type: "button", disabled: "" });
  const sync = () => { if (input.value.trim()) go.removeAttribute("disabled"); else go.setAttribute("disabled", ""); };
  const submit = () => { if (!input.value.trim()) return; answers[q.key] = input.value.trim(); index++; render(); };
  input.addEventListener("input", sync);
  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  go.addEventListener("click", submit);
  sync();

  const centered = el("div", { class: "centered" }, [
    el("div", { class: "stack", style: "gap:14px" }, [
      el("div", { class: "rule", "aria-hidden": "true" }),
      el("h1", { class: "display", text: "Shop Check" }),
      el("p", { class: "tagline", text: "Answer 8 quick questions. Get one clear thing to fix first." })
    ]),
    el("div", { class: "stack", style: "gap:10px" }, [
      el("label", { class: "label", for: "biz", text: "Your business name", style: "margin:0" }),
      input
    ]),
    go
  ]);
  app.appendChild(centered);
  app.appendChild(el("p", { class: "fine bottom", text: "No cost. No account. Takes about a minute. Nothing leaves your phone." }));
  window.scrollTo(0, 0);
}

function costFor(key, strength) {
  const m = MODULES[key];
  const jobs = answers.jobsPerMonth;
  const table = (strength === "weak" && m.weakCost) ? m.weakCost : m.cost;
  return (table && table[jobs]) ? fill(table[jobs], answers) : "";
}

function mainCard(key, strength) {
  const m = MODULES[key];
  const cost = costFor(key, strength);
  const card = el("article", { class: "card main" }, [
    el("p", { class: "body", text: fill(m.what, answers) })
  ]);
  if (cost) card.appendChild(el("div", { class: "callout" }, [
    el("div", { class: "kicker", text: "What it's costing you now" }),
    el("div", { class: "cost", text: cost })
  ]));
  return card;
}

function quietCard(key, tagText, strength) {
  const m = MODULES[key];
  const cost = costFor(key, strength);
  const card = el("article", { class: "card quiet" }, [
    el("div", { class: "kicker tag", text: tagText }),
    el("h2", { text: m.name }),
    el("p", { class: "body", text: fill(m.what, answers) })
  ]);
  if (cost) card.appendChild(el("p", { class: "cost" }, [ el("strong", { text: "Costing you now: " }), cost ]));
  return card;
}

/* The text that gets pre-filled into the SMS / email. Kept short on
   purpose: sms: links have to survive being pasted into a phone's
   messaging app. */
function buildMessage(result) {
  const lines = [];
  lines.push(`Hi, it's ${answers.businessName} (${answers.trade}).`);
  if (result.startHere) {
    lines.push(`Shop Check says start with: ${MODULES[result.startHere].name}.`);
    if (result.next.length) lines.push(`Next: ${result.next.map(k => MODULES[k].name).join(", ")}.`);
  } else {
    lines.push("Shop Check says: nothing urgent right now.");
  }
  lines.push(CONTACT_COPY.signoff);
  if (PARAMS.ref) lines.push(`Ref: ${PARAMS.ref}`);
  return lines.join("\n");
}

/* iPhones want "sms:NUMBER&body=", Android wants "sms:NUMBER?body=". */
function isApple() {
  const ua = navigator.userAgent || "";
  return /iPhone|iPad|iPod/.test(ua) || (ua.includes("Macintosh") && navigator.maxTouchPoints > 0);
}
function smsLink(number, body) {
  const digits = number.replace(/[^\d+]/g, "");
  const sep = isApple() ? "&" : "?";
  return `sms:${digits}${sep}body=${encodeURIComponent(body)}`;
}
function mailLink(address, subject, body) {
  return `mailto:${address}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
/* Phone or tablet = a mobile user agent, or a Mac user agent with a
   touchscreen (iPadOS reports itself as a Mac). Everything else,
   touchscreen Windows laptops included, gets the desktop fallback,
   since sms: links go nowhere there. */
function isMobile() {
  const ua = navigator.userAgent || "";
  const mobileUA = /Android|iPhone|iPad|iPod|Mobile|Tablet|Silk|Kindle/i.test(ua);
  const ipadOS = ua.includes("Macintosh") && navigator.maxTouchPoints > 0;
  return mobileUA || ipadOS;
}
async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* fall through to the old way */ }
  const ta = el("textarea", { readonly: "", style: "position:fixed;top:0;left:0;opacity:0" });
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
function isDev() {
  return new URLSearchParams(location.search).get("dev") === "1";
}

/* ---------------------------------------------------------------------
   Link parameters.
   ?name=  pre-fills the business name and skips the first screen.
           Trimmed, stripped of HTML, capped at 80 characters.
   ?ref=   a short tag saying which prospect the link went to. Letters,
           numbers and dashes, up to 32 characters. Never shown on
           screen; it rides along in the message and in config.json.
           Anything else is ignored.
   --------------------------------------------------------------------- */
const NAME_MAX = 80;
const REF_PATTERN = /^[A-Za-z0-9-]{1,32}$/;

function cleanName(raw) {
  if (!raw) return "";
  return String(raw)
    .replace(/<\/?[a-zA-Z][^>]*>/g, "")   /* drop anything that looks like a tag */
    .replace(/[<>]/g, "")      /* and any stray angle brackets */
    .replace(/\s+/g, " ")
    .trim()
    .slice(0, NAME_MAX)
    .trim();
}

function cleanRef(raw) {
  if (!raw) return null;
  const ref = String(raw).trim();
  return REF_PATTERN.test(ref) ? ref : null;
}

function readParams() {
  let q;
  try { q = new URLSearchParams(location.search); } catch (e) { return { name: "", ref: null }; }
  return { name: cleanName(q.get("name")), ref: cleanRef(q.get("ref")) };
}

const PARAMS = readParams();

/* The contact block. Same logic as before: phones get the sms: button,
   desktops get the message to copy plus the number written out. */
function contactBlock(result) {
  const message = buildMessage(result);
  const box = el("div", { class: "contact" });
  box.appendChild(el("h2", { class: "contact-head", text: "Want this set up?" }));

  if (isMobile()) {
    const mail = el("a", { class: "link alt", href: mailLink(CONTACT.email, CONTACT_COPY.subject, message), text: CONTACT_COPY.emailLink });
    box.appendChild(el("a", { class: "btn", href: smsLink(CONTACT.phone, message), text: CONTACT_COPY.button }));
    box.appendChild(mail);
  } else {
    const copyBtn = el("button", { class: "btn secondary", text: CONTACT_COPY.copy, type: "button" });
    copyBtn.addEventListener("click", async () => {
      const ok = await copyText(message);
      copyBtn.textContent = ok ? CONTACT_COPY.copied : CONTACT_COPY.copy;
      setTimeout(() => { copyBtn.textContent = CONTACT_COPY.copy; }, 2000);
    });
    box.appendChild(el("div", { class: "msgbox" }, [
      el("div", { class: "kicker", text: "The message the button would send" }),
      el("pre", { class: "msg", text: message }),
      copyBtn
    ]));
    box.appendChild(el("div", { class: "phone" }, [
      el("div", { class: "phone-label", text: CONTACT_COPY.callLabel }),
      el("div", { class: "phone-number", text: CONTACT.phone })
    ]));
    box.appendChild(el("a", { class: "link alt", href: mailLink(CONTACT.email, CONTACT_COPY.subject, message), text: `${CONTACT_COPY.emailLink}: ${CONTACT.email}` }));
  }
  box.appendChild(el("p", { class: "fine", text: CONTACT_COPY.reassure }));

  if (isDev()) {
    const dl = el("button", { class: "btn secondary", text: "Download config.json", type: "button" });
    dl.addEventListener("click", () => downloadConfig(result));
    box.appendChild(dl);
  }
  return box;
}

function bottomLinks() {
  const back = link("Back", () => { index = QUESTIONS.length - 1; render(); }, true);
  const again = link("Start over", startOver, true);
  return el("div", { class: "bottom-links" }, [back, again]);
}

function renderResults() {
  wrap.classList.add("wide");
  const result = evaluate(answers);
  const left = el("div", { class: "left" });
  const right = el("div", { class: "right" });

  if (result.startHere) {
    left.appendChild(el("div", { class: "hero" }, [
      el("div", { class: "kicker-lg", text: "Start here:" }),
      el("h1", { class: "result-name", text: MODULES[result.startHere].name })
    ]));
    left.appendChild(mainCard(result.startHere, result.strength[result.startHere]));
    if (result.next.length) {
      const list = el("div", { class: "quiet-list" + (result.next.length === 1 ? " single" : "") });
      result.next.forEach((key, i) => list.appendChild(quietCard(key, i === 0 ? "Next" : "After that", result.strength[key])));
      left.appendChild(list);
    }
    left.appendChild(el("div", { class: "not", text: NOT_LINE }));
  } else {
    left.appendChild(el("div", { class: "good" }, [
      el("div", { class: "rule", "aria-hidden": "true" }),
      el("h1", { class: "result-name", text: ALL_GOOD.name }),
      el("p", { class: "body", text: fill(ALL_GOOD.what, answers) })
    ]));
  }

  right.appendChild(contactBlock(result));

  app.appendChild(left);
  app.appendChild(right);
  app.appendChild(bottomLinks());
  window.scrollTo(0, 0);
}

function buildConfig(result) {
  return {
    app: "Shop Check",
    version: 1,
    createdAt: new Date().toISOString(),
    answers: Object.fromEntries(QUESTIONS.map(q => [q.key, answers[q.key] ?? null])),
    ref: PARAMS.ref,
    modules: result.enabled,
    matchStrength: result.strength,
    startHere: result.startHere,
    next: result.next
  };
}

function downloadConfig(result) {
  const json = JSON.stringify(buildConfig(result), null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: "config.json" });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* Exposed for testing in the console: ShopCheck.evaluate({...answers}) */
window.ShopCheck = { evaluate, buildConfig, buildMessage, smsLink, mailLink, isMobile, cleanName, cleanRef, PARAMS, MODULES, QUESTIONS, RULES, CONTACT };

index = seedFromParams();
render();
</script>
</body>
</html>
